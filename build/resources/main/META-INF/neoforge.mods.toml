# HD Skin Support — перенос на NeoForge 1.21.1 (FML 4).
# Исходный jar описан под NeoForge 1.20.2–1.20.4 (META-INF/mods.toml), и FML 4 его пропускал:
# «is for Minecraft Forge or an older version of NeoForge». Код миксина под 1.21.1 сверен javap.
#
# Мод без кода (lowcodefml): только миксин в HttpTexture. Конфиг миксинов FML 4 берёт ТОЛЬКО
# из [[mixins]] — строка MixinConfigs в MANIFEST им не читается.
modLoader="lowcodefml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="hdskinsupport"
version="1.0.1"
displayName="HD Skin Support"
authors="dima_dencep, Gravita"
credits="Перенос на NeoForge 1.21.1 — для проекта BrutalCat"
description='''Поддержка HD-скинов: скины крупнее 64×64 (128×128, 256×256 и т.д.) больше не отбрасываются.
Нужен только на клиенте.'''

[[mixins]]
config="hdskinsupport.mixins.json"

[[dependencies.hdskinsupport]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

# HttpTexture.processLegacySkin сверен только для 1.21.1 — шире диапазон не открываем
[[dependencies.hdskinsupport]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"
